# Alloy: restella 네임스페이스의 컨테이너 로그를 Loki로 보낸다 (values/demo/alloy.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # monitoring(1)과 함께. 앱(2)이 뜨기 전에 수집 준비를 마친다
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/infra/gitops/values/demo/alloy.yaml
    - repoURL: https://github.com/vsfirst/restella.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
