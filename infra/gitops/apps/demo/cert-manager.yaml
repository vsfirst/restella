# cert-manager: Ingress의 cert-manager.io/cluster-issuer 표시를 보고 Let's Encrypt 인증서를 발급·갱신한다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # ClusterIssuer(cluster-config, 0)보다 먼저 CRD를 만든다
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/infra/gitops/values/demo/cert-manager.yaml
    - repoURL: https://github.com/vsfirst/restella.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRD가 커서 클라이언트 적용의 어노테이션 크기 제한을 넘는다
    # 앞 단계가 막 떠서 일시적으로 실패할 수 있다(예: cert-manager·ESO webhook의 CA 주입 전). 기본값은 재시도하지 않는다
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
