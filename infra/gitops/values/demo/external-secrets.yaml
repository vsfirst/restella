# demo ESO. AWS 인증은 설정하지 않는다: 노드 IAM 역할을 인스턴스 메타데이터(IMDS 홉 2)로 쓴다 (ADR-0003)
installCRDs: true

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 256Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Prometheus를 구성한 뒤 켠다 (ServiceMonitor CRD가 있어야 한다)
serviceMonitor:
  enabled: false
