apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "front-end.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "front-end.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
