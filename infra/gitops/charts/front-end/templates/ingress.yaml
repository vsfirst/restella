{{- if .Values.ingress.enabled }}
# 운영자 콘솔 전체를 연다. 로그인하지 않은 요청은 proxy.ts가 로그인 화면으로 보낸다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-end
  labels:
    {{- include "front-end.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ required "ingress.host가 필요하다 (ApplicationSet이 넣는다)" .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.name }}
                port:
                  name: http
{{- end }}
