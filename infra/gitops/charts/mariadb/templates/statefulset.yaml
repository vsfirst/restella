apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
spec:
  replicas: 1 # 단일 인스턴스. 고가용성은 범위 밖이다 (docs/1-planning/scope.md)
  serviceName: mariadb-headless
  selector:
    matchLabels:
      {{- include "mariadb.selectorLabels" . | nindent 6 }}
  # StatefulSet을 지우거나 줄여도 데이터 볼륨(PVC)은 남긴다
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        {{- include "mariadb.labels" . | nindent 8 }}
      annotations:
        # 설정이 바뀌면 Pod를 다시 띄운다
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false # Kubernetes API를 쓸 일이 없다
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        # 공식 이미지의 mysql 사용자(999)로 바로 실행한다. root로 시작해 권한을 낮추는 단계가 필요 없다
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: {{ include "mariadb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.auth.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.auth.username | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.passwordSecret.name }}
                  key: {{ .Values.auth.passwordSecret.key }}
            # root는 쓰지 않는다. 무작위 비밀번호로 만들고 Pod 안(localhost)에서만 접속할 수 있게 한다
            - name: MARIADB_RANDOM_ROOT_PASSWORD
              value: "1"
            - name: MARIADB_ROOT_HOST
              value: localhost
          ports:
            - name: mysql
              containerPort: 3306
          # healthcheck.sh는 공식 이미지에 들어 있다. 초기화 때 만든 healthcheck 사용자로 확인한다
          startupProbe: # 첫 초기화(데이터 디렉토리 생성)에 시간이 걸릴 수 있다: 최대 5분
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # 쓰기는 데이터 볼륨과 아래 emptyDir에만 한다
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/restella.cnf
              subPath: restella.cnf
              readOnly: true
            - name: run
              mountPath: /run/mysqld # 소켓과 PID 파일
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mariadb-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mariadb.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
