# 앱이 접속하는 주소: mariadb.<네임스페이스>.svc.cluster.local:3306
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mariadb.selectorLabels" . | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
# StatefulSet의 고정 Pod 이름(mariadb-0)용 헤드리스 서비스
apiVersion: v1
kind: Service
metadata:
  name: mariadb-headless
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "mariadb.selectorLabels" . | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
