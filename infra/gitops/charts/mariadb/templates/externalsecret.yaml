{{- if .Values.externalSecret.enabled }}
# Secrets Manager의 값을 Kubernetes Secret으로 만든다. Git에는 "무엇을 가져올지"만 있다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.auth.passwordSecret.name }}
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ .Values.auth.passwordSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.auth.passwordSecret.key }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.property }}
{{- end }}
