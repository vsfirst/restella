{{- range .Values.ecrPullSecret.namespaces }}
# ECR 인증 토큰 생성기. 노드 IAM 역할로 토큰을 받는다
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: ecr-token
  namespace: {{ . }}
spec:
  region: {{ $.Values.region }}
---
# 이미지 pull Secret. 레지스트리 주소(AWS 계정 ID 포함)는 토큰 응답에서 받으므로 Git에 없다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.ecrPullSecret.name }}
  namespace: {{ . }}
spec:
  refreshInterval: {{ $.Values.ecrPullSecret.refreshInterval }}
  target:
    name: {{ $.Values.ecrPullSecret.name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {{`{"auths":{"{{ .proxy_endpoint | replace "https://" "" }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}`}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-token
---
{{- end }}
