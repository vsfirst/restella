{{- if .Values.networkPolicy.enabled }}
# API에 들어오는 접속: front-end(BFF)와 Ingress 컨트롤러만. 나가는 트래픽은 네임스페이스 공통 정책(메타데이터 차단)을 따른다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: back-end
  labels:
    {{- include "back-end.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "back-end.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedClients }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.ingressController }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3000
    {{- if .Values.monitoring.serviceMonitor.enabled }}
    {{- with .Values.networkPolicy.metricsScraper }}
    # Prometheus의 /metrics 수집
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
    {{- end }}
    {{- end }}
{{- end }}
