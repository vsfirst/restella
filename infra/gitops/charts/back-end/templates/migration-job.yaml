{{- if .Values.migration.enabled }}
# 마이그레이션 → 시드. Argo CD가 배포(Sync)할 때마다 API보다 먼저 실행하고 끝날 때까지 기다린다.
# 로컬 compose의 back-end-migrate와 같은 역할이다
apiVersion: batch/v1
kind: Job
metadata:
  name: back-end-migrate
  labels:
    {{- include "back-end.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation # 다음 배포 전까지 남겨 로그를 볼 수 있게 한다
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "back-end.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "back-end.podSecurityContext" . | nindent 8 }}
      {{- if .Values.migration.seed }}
      initContainers:
        - name: migrate
          image: {{ include "back-end.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/database/run-migrations.js"]
          env:
            {{- include "back-end.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- include "back-end.containerSecurityContext" . | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ if .Values.migration.seed }}seed{{ else }}migrate{{ end }}
          image: {{ include "back-end.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", {{ if .Values.migration.seed }}"dist/database/seeds/run-seed.js"{{ else }}"dist/database/run-migrations.js"{{ end }}]
          env:
            {{- include "back-end.env" . | nindent 12 }}
            {{- range .Values.secret.seedKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- include "back-end.containerSecurityContext" . | nindent 12 }}
{{- end }}
