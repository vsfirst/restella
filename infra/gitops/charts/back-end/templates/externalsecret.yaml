{{- if .Values.secret.externalSecret.enabled }}
# Secrets Manager restella-demo의 be 객체를 그대로 Secret으로 만든다 (키 이름 = 환경변수 이름)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "back-end.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Secret이 준비된 뒤 마이그레이션 Job(0)과 API(1)가 뜬다
spec:
  refreshInterval: {{ .Values.secret.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secret.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.secret.externalSecret.secretStoreRef.name }}
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secret.externalSecret.remoteKey }}
        property: {{ .Values.secret.externalSecret.property }}
{{- end }}
